<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleNotes UI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 { text-align: center; color: #569cd6; }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: #252526;
            padding: 15px;
            border-radius: 8px;
        }
        input, textarea {
            padding: 10px;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            background: #1e1e1e;
            color: #d4d4d4;
            font-size: 1rem;
        }
        button {
            padding: 10px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background-color: #1177bb; }
        .note {
            background: #252526;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #569cd6;
        }
        .note-title { font-weight: bold; color: #9cdcfe; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SimpleNotes</h1>
        
        <div class="input-group">
            <input type="text" id="noteTitle" placeholder="Title (optional)">
            <textarea id="noteText" placeholder="Write your note here..." rows="3"></textarea>
            <button onclick="addNote()">Add Note</button>
        </div>

        <div id="notesList"></div>
    </div>

    <script>
        // Fetch and display notes on load
        async function loadNotes() {
            const res = await fetch('/notes');
            const notes = await res.json();
            const list = document.getElementById('notesList');
            list.innerHTML = '';
            notes.forEach(note => {
                list.innerHTML += `
                    <div class="note">
                        <div class="note-title">${note.title}</div>
                        <div>${note.text}</div>
                    </div>
                `;
            });
        }

        // Add a new note
        async function addNote() {
            const title = document.getElementById('noteTitle').value;
            const text = document.getElementById('noteText').value;
            
            if (!text) return alert('Text is required!');

            await fetch('/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title || 'Untitled', text })
            });

            document.getElementById('noteTitle').value = '';
            document.getElementById('noteText').value = '';
            loadNotes(); // Refresh the list
        }

        loadNotes();
    </script>
</body>
</html>
